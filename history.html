<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>会計履歴</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

<link rel="stylesheet" href="theme-ui.css?v=20261023-1">
</head>

<body class="history-body">

<header class="site-header">

    <h1>
        会計履歴
    </h1>

    <div class="header-actions">

<nav class="page-nav">

    <a href="index.html" class="nav-button">
        🔧 メカニック
    </a>

    <a href="colors.html" class="nav-button">
        🎨 ギャング・半グレカラー
    </a>

    <a
        href="history.html"
        class="nav-button active"
    >
        🧾 会計履歴
    </a>

</nav>

        <button
            type="button"
            id="themeButton"
        >
            🌙 ダークモード
        </button>

    </div>

</header>


    <main class="history-page">

        <section class="history-section">

            <div class="history-header">

                <h2>
                    最新の会計
                </h2>

                <button
                    type="button"
                    id="clearHistoryButton"
                >
                    履歴を全削除
                </button>

            </div>


            <div id="historyList">

                <p class="history-empty">
                    履歴はまだありません
                </p>

            </div>


            <p class="history-limit">
                最大30件まで保存されます
            </p>

        </section>

    </main>


    <script>

        const HISTORY_STORAGE_KEY =
            "mechanicPaymentHistory";

        const MAX_HISTORY_COUNT =
            30;


        const historyList =
            document.getElementById(
                "historyList"
            );

        const clearHistoryButton =
            document.getElementById(
                "clearHistoryButton"
            );

            const themeButton =
    document.getElementById(
        "themeButton"
    );

        function getPaymentHistory() {

            try {

                const saved =
                    localStorage.getItem(
                        HISTORY_STORAGE_KEY
                    );

                if (!saved) {
                    return [];
                }

                const history =
                    JSON.parse(saved);

                if (!Array.isArray(history)) {
                    return [];
                }

                return history;

            } catch (error) {

                console.error(
                    "会計履歴の読み込みに失敗しました。",
                    error
                );

                return [];
            }

        }


        function savePaymentHistory(
            history
        ) {

            localStorage.setItem(
                HISTORY_STORAGE_KEY,
                JSON.stringify(
                    history.slice(
                        0,
                        MAX_HISTORY_COUNT
                    )
                )
            );

        }


        function renderPaymentHistory() {

            const history =
                getPaymentHistory();

            historyList.innerHTML =
                "";


            if (
                history.length === 0
            ) {

                historyList.innerHTML =
                    `
                    <p class="history-empty">
                        履歴はまだありません
                    </p>
                    `;

                return;
            }


            history.forEach(
                (item) => {

                    const row =
                        document.createElement(
                            "div"
                        );

                    row.className =
                        "history-item";


                    row.innerHTML = `
                        <div class="history-info">

                            <span class="history-date">
                                ${item.date}
                            </span>

                            <strong class="history-price">
                                ¥${Number(item.amount).toLocaleString("ja-JP")}
                            </strong>

                        </div>

                        <div class="history-item-buttons">

                            <button
                                type="button"
                                class="history-copy-button"
                            >
                                金額コピー
                            </button>

                            <button
                                type="button"
                                class="history-delete-button"
                            >
                                削除
                            </button>

                        </div>
                    `;


                    const copyButton =
                        row.querySelector(
                            ".history-copy-button"
                        );


                    copyButton.addEventListener(
                        "click",
                        async () => {

                            await navigator
                                .clipboard
                                .writeText(
                                    String(
                                        item.amount
                                    )
                                );


                            const oldText =
                                copyButton
                                    .textContent;


                            copyButton.textContent =
                                "コピーしました！";


                            setTimeout(
                                () => {

                                    copyButton.textContent =
                                        oldText;

                                },
                                1000
                            );

                        }
                    );


                    row
                        .querySelector(
                            ".history-delete-button"
                        )
                        .addEventListener(
                            "click",
                            () => {

                                const newHistory =
                                    getPaymentHistory()
                                        .filter(
                                            (historyItem) =>
                                                historyItem.id !==
                                                item.id
                                        );


                                savePaymentHistory(
                                    newHistory
                                );


                                renderPaymentHistory();

                            }
                        );


                    historyList.appendChild(
                        row
                    );

                }
            );

        }


        clearHistoryButton.addEventListener(
            "click",
            () => {

                const history =
                    getPaymentHistory();


                if (
                    history.length === 0
                ) {
                    return;
                }


                const confirmed =
                    confirm(
                        "会計履歴をすべて削除しますか？"
                    );


                if (!confirmed) {
                    return;
                }


                localStorage.removeItem(
                    HISTORY_STORAGE_KEY
                );


                renderPaymentHistory();

            }
        );

// ==========================================
// ダークモード
// ==========================================

const savedTheme =
    localStorage.getItem(
        "theme"
    );


if (
    savedTheme === "dark"
) {

    document.body
        .classList
        .add("dark");

    themeButton.textContent =
        "☀️ 通常モード";

}


themeButton.addEventListener(
    "click",
    () => {

        document.body
            .classList
            .toggle("dark");


        const dark =
            document.body
                .classList
                .contains("dark");


        themeButton.textContent =
            dark
                ? "☀️ 通常モード"
                : "🌙 ダークモード";


        localStorage.setItem(
            "theme",
            dark
                ? "dark"
                : "light"
        );

    }
);
        renderPaymentHistory();

    </script>

<script src="theme-ui.js?v=20261023-1"></script>
</body>

</html>
