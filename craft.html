<main><section aria-labelledby="totalTitle"><div class="craft-heading"><h2 id="totalTitle">必要素材の合計</h2><button id="craftReset" type="button">個数をリセット</button></div><div id="craftTotals" aria-live="polite"></div><p id="craftCount" class="help" role="status"></p><p class="help">下の一覧で作成個数を指定してください。検索で非表示の項目も合計に含みます。個数はこの画面だけで使用し、再読み込みでリセットされます。</p></section>
